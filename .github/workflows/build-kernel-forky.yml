name: Build Armbian Kernel
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build Armbian Kernel
        uses: armbian/build@main
        continue-on-error: true # <--- ЭТО ВАЖНО: не падать, если упаковка хедеров зависла
        with:
          armbian_token: ${{ secrets.GITHUB_TOKEN }}
          armbian_board: "orangepi5-plus"
          armbian_release: "bookworm"
          armbian_target: "kernel"
          armbian_ui: "minimal"
          armbian_kernel_branch: "current"
          armbian_runner_clean: "no"

      - name: Verify Kernel Config
        # Если билд упал, этот шаг всё равно запустится
        if: always() 
        run: |
          cd build/output/debs/ || exit 0
          IMAGE_PKG=$(ls linux-image-current-rockchip64_*.deb 2>/dev/null | head -n 1)
          if [ -z "$IMAGE_PKG" ]; then echo "Пакеты не найдены!"; exit 0; fi
          
          echo "Checking package: $IMAGE_PKG"
          ar x "$IMAGE_PKG" data.tar.xz
          tar -xJf data.tar.xz --wildcards './boot/config-*'
          
          echo "--- FINAL KERNEL CONFIG CHECK ---"
          grep "CONFIG_CPU_FREQ_GOV_ONDEMAND" boot/config-*
          echo "---------------------------------"
      - name: Upload Kernel Packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: armbian-kernel-packages
          path: build/output/debs/*.deb
